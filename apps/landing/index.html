<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IqraSpace</title>
  <meta name="description" content="IqraSpace — a free, non-commercial ecosystem for learning the Quran. Read. Listen. Learn. Reflect.">
  <link rel="canonical" href="https://iqraspace.org/">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IqraSpace">
  <meta property="og:title" content="IqraSpace">
  <meta property="og:description" content="A free, non-commercial ecosystem for learning the Quran. Read. Listen. Learn. Reflect.">
  <meta property="og:url" content="https://iqraspace.org/">
  <meta property="og:image" content="https://iqraspace.org/logo.png">
  <meta name="twitter:card" content="summary">

  <style>
    :root {
      --color-bg: #faf7f0;
      --color-surface: #ffffff;
      --color-text: #1f2a24;
      --color-text-muted: #5b6b62;
      --color-primary: #0f5c4f;
      --color-primary-contrast: #ffffff;
      --color-accent-text: #8a6420;
      --color-border: #e4ddcc;
      --color-focus-ring: #0f5c4f;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #101512;
        --color-surface: #17201b;
        --color-text: #eef1ee;
        --color-text-muted: #a3b0a8;
        --color-primary: #3ba98e;
        --color-primary-contrast: #0a1210;
        --color-accent-text: #d3a55c;
        --color-border: #2a352e;
        --color-focus-ring: #3ba98e;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    main {
      max-width: 34rem;
      width: 100%;
      text-align: center;
    }

    .logo-heading {
      margin: 0;
    }

    .logo {
      width: min(280px, 70vw);
      height: auto;
      margin: 0 auto 1rem;
      display: block;
    }

    .tagline {
      margin: 0 0 2rem;
      color: var(--color-text-muted);
      font-size: 1.05rem;
    }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.85rem;
      margin-bottom: 2rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--color-primary);
      color: var(--color-primary-contrast);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 0.85rem 1.75rem;
      border-radius: 0.6rem;
    }
    .cta.secondary {
      background: transparent;
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
      padding: calc(0.85rem - 2px) calc(1.75rem - 2px);
    }
    .cta:focus-visible {
      outline: 3px solid var(--color-focus-ring);
      outline-offset: 2px;
    }

    footer {
      margin-top: 3rem;
      color: var(--color-text-muted);
      font-size: 0.85rem;
    }

    @media (prefers-reduced-motion: no-preference) {
      .cta { transition: transform 0.15s ease; }
      .cta:hover { transform: translateY(-1px); }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="logo-heading">
      <img class="logo" src="/logo.png" width="1254" height="1254" alt="IqraSpace — Read. Listen. Learn. Reflect.">
    </h1>
    <p class="tagline">A free, non-commercial home for learning the Quran.</p>

    <div class="cta-group">
      <a class="cta" href="/quran">
        Open the Quran Reader
        <span aria-hidden="true">&rarr;</span>
      </a>
      <a class="cta secondary" href="/learning">
        Go to Learning
        <span aria-hidden="true">&rarr;</span>
      </a>
    </div>

    <footer>
      <p>&copy; IqraSpace. A Sadaqah Jariyah project — free, ad-free, always.</p>
    </footer>
  </main>
</body>
</html>
