name: CI/CD (Quran)

# Fully independent of .github/workflows/ci.yml (apps/web's tutoring app
# pipeline) and ci-landing.yml (apps/landing) — see
# apps/quran/ARCHITECTURE.md §8. Path-filtered so a change to one app
# never triggers or blocks another's pipeline.
#
# `deploy` mirrors ci.yml's proven shape (vercel pull → vercel build
# --prod → vercel deploy --prebuilt --prod → health check), gated to a
# push on main, using this app's own dedicated QURAN_VERCEL_*/QURAN_
# secrets — never apps/web's or apps/landing's Vercel project or secrets
# (ARCHITECTURE.md §2). See DEPLOYMENT.md for the exact secret names and
# where each value comes from.

on:
  push:
    branches: [main]
    paths:
      - "apps/quran/**"
      - ".github/workflows/ci-quran.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/quran/**"
      - ".github/workflows/ci-quran.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/quran

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: apps/quran/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Same reason as apps/web's workflow: tsc needs next-env.d.ts and
      # .next/types/**, only generated as a side effect of dev/build.
      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npm run typecheck

      # No test suite exists yet (see PROJECT-STATUS.md) — --if-present
      # makes this a no-op instead of a failure until one is added.
      - name: Run tests (if any)
        run: npm run test --if-present

      # Needs no Quran Foundation / Supabase credentials: the synced
      # content this build's SSG routes read (getAllChapters() etc.) is
      # committed to the repo, not fetched live — see .gitignore's note
      # on src/content/generated/. NEXT_BASE_PATH is deliberately left
      # unset here (same as local dev) — this validate build only needs
      # to prove the code builds, not reproduce the production basePath;
      # the deploy job below builds via the real Vercel project, which
      # has NEXT_BASE_PATH=/quran set.
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel (production)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: vercel-quran
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.QURAN_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.QURAN_VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls this project's own Production env vars (NEXT_BASE_PATH,
      # QURAN_FOUNDATION_*, NEXT_PUBLIC_SUPABASE_*) already configured in
      # the Vercel dashboard — see DEPLOYMENT.md for the full list of
      # names (values are never in this repo).
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.QURAN_VERCEL_TOKEN }}"

      - name: Build via Vercel
        run: vercel build --prod --token="${{ secrets.QURAN_VERCEL_TOKEN }}"

      - name: Deploy prebuilt output to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.QURAN_VERCEL_TOKEN }}")
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Checks this deployment directly (bypassing the apps/landing
      # rewrite, a separate pipeline — this only proves *this* deploy
      # succeeded). "/quran" not "/": NEXT_BASE_PATH means bare "/" 404s
      # on this project by design (ARCHITECTURE.md §8).
      #
      # NOTE: apps/web's Vercel team has Deployment Protection (SSO) on,
      # which makes every ephemeral per-deployment URL (what
      # steps.deploy.outputs.url is) require a logged-in account and
      # therefore fail this curl check — see root DEPLOYMENT.md. If this
      # app's Vercel team (confirmed different, see PROJECT-STATUS.md)
      # turns out to have the same setting on, switch this to check the
      # project's stable <project>.vercel.app alias instead, same fix
      # ci.yml already uses.
      - name: Health check
        run: |
          set -e
          for path in "/quran" "/quran/surah" "/quran/sitemap.xml"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}$path")
            echo "$path -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::Health check failed for $path (HTTP $code)"
              exit 1
            fi
          done

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Run | #${{ github.run_number }} (run id ${{ github.run_id }}) |"
            echo "| Triggered by | ${{ github.actor }} |"
            echo "| Timestamp (UTC) | $(date -u +'%Y-%m-%d %H:%M:%S') |"
            echo "| Deployment URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Public URL | https://iqraspace.org/quran |"
          } >> "$GITHUB_STEP_SUMMARY"
